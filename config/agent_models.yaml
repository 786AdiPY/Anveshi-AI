      max_tokens: 3072
    max_iterations: 6
    system_prompt_file: config/agents/challenger/AGENT.md

  verifier_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.1
      max_tokens: 3072
    max_iterations: 12
    system_prompt_file: config/agents/verifier/AGENT.md

  ledger_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.1
      max_tokens: 1536
    max_iterations: 12
    system_prompt_file: config/agents/ledger/AGENT.md

  evidence_graph_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.1
      max_tokens: 1536
    max_iterations: 12
    system_prompt_file: config/agents/evidence_graph/AGENT.md

  synthesizer_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.7
      max_tokens: 4096
    max_iterations: 12
    system_prompt_file: config/agents/synthesizer/AGENT.md
