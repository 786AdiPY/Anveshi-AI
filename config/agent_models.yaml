# Per-agent model configuration.
#
# Provider/model per agent. LLM_PROVIDER + LLM_MODEL in .env override both
# for every agent at once (currently: groq / llama-3.3-70b-versatile).
#
# max_tokens caps the completion. Ledger and graph agents emit small JSON, so
# they get the tightest caps; the synthesizer writes the full brief and needs
# room. Tighten these again if you move back to a metered provider.
#
# max_iterations bounds the tool-calling rounds inside one agent, and is the
# main driver of wall-clock time per run.

agents:
  planner_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.7
      max_tokens: 2048
    max_iterations: 12
    system_prompt_file: config/agents/planner/AGENT.md

  supervisor_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.5
      max_tokens: 1024
    max_iterations: 12
    system_prompt_file: config/agents/supervisor/AGENT.md

  literature_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.5
      max_tokens: 3072
    max_iterations: 6
    system_prompt_file: config/agents/literature/AGENT.md

  extractor_agent:
