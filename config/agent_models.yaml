# Per-agent model configuration.
#
# Model: openai/gpt-4o-mini
# max_tokens is set to 600 per agent to fit within remaining OpenRouter credit limits.

agents:
  planner_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.7
      max_tokens: 600
    max_iterations: 12
    system_prompt_file: config/agents/planner/AGENT.md

  supervisor_agent:
    provider: openrouter
    model_config:
      model: openai/gpt-4o-mini
      temperature: 0.5
      max_tokens: 500
    max_iterations: 12
    system_prompt_file: config/agents/supervisor/AGENT.md

  literature_agent:
